# index.html (the SPA shell, also served for every app route) must be revalidated, or browsers keep an old copy that
# points at the previous deploy's bundles. The hashed files in /assets can be cached; other responses are untouched
# (an empty value means nginx sends no header).
map $sent_http_content_type $cache_control {
    ~^text/html   "no-cache";
    default       "";
}

server {
    listen 80;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Sent on every response, API included. Locations below must not use add_header, or these stop being inherited.
    # style-src needs 'unsafe-inline' for Vuetify's runtime theme <style> and Tiptap; scripts are bundle-only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Matches FileUploadLimits (5 MB file); nginx's 1 MB default would reject uploads before they reach the API
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
