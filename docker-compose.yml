services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      App__BaseUrl: https://scholarships.shudak.com
    # Credentials live in gitignored env files (see secrets/*.env.example); missing files fall back to defaults
    env_file:
      - path: ./secrets/jwt.env
      - path: ./secrets/db.env
      - path: ./secrets/r2.env
        required: false
      - path: ./secrets/email.env
        required: false
      - path: ./secrets/twofactor.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  # Published on all of the host's interfaces so admins can connect from other computers. Anyone who can reach the
  # host on 3306 can try to log in: keep a strong password in secrets/mysql.env and limit 3306 to trusted IPs with a
  # firewall (on Linux, Docker-published ports bypass ufw; restrict them in the DOCKER-USER iptables chain instead).
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - path: ./secrets/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  caddy_data:
  caddy_config: