services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      App__BaseUrl: https://scholarships.shudak.com
    # Credentials live in gitignored env files (see secrets/*.env.example); missing files fall back to defaults
    env_file:
      - path: ./secrets/jwt.env
      - path: ./secrets/db.env
      - path: ./secrets/r2.env
        required: false
      - path: ./secrets/email.env
        required: false
      - path: ./secrets/twofactor.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  # Published on the server's loopback only, so it's reachable from the server itself or through an SSH tunnel,
  # never directly from the network. To expose it on one machine, use a gitignored docker-compose.override.yml.
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - path: ./secrets/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  caddy_data:
  caddy_config: