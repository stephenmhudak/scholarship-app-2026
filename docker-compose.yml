# Host-specific settings (domain, ports, MySQL exposure) come from .env in this folder, written by deploy/deploy.sh
# (Ubuntu, macOS) or deploy/deploy.ps1 (Windows). Every one is required: there are no defaults.
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:?not set in .env}:80"
      - "${HTTPS_PORT:?not set in .env}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?not set in .env}
      ACME_EMAIL: ${ACME_EMAIL:?not set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      App__BaseUrl: ${APP_BASE_URL:?not set in .env}
    # Credentials live in gitignored env files written by the deploy scripts (see secrets/*.env.example)
    env_file:
      - path: ./secrets/jwt.env
      - path: ./secrets/db.env
      - path: ./secrets/storage.env
      - path: ./secrets/email.env
      - path: ./secrets/twofactor.env
    # Uploads saved with Storage:Provider = Local survive rebuilds
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  # MYSQL_BIND is 127.0.0.1 in production (only this host can reach 3306, and root is limited to connections from
  # inside the container) and 0.0.0.0 in testing (any host, root included). On Linux, Docker-published ports bypass
  # ufw: restrict a 0.0.0.0 binding in the DOCKER-USER iptables chain if the host is reachable from untrusted networks.
  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_BIND:?not set in .env}:${MYSQL_PORT:?not set in .env}:3306"
    env_file:
      - path: ./secrets/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
  uploads_data:
