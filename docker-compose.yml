services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__R2__AccountId: ${R2_ACCOUNT_ID:-}
      Storage__R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      Storage__R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      Storage__R2__BucketName: ${R2_BUCKET_NAME:-scholarship-files}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: App!Password_2026
      MYSQL_DATABASE: scholarship_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pApp!Password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  caddy_data:
  caddy_config: