# Copy to jwt-secret.yaml (gitignored), fill in the value, then: kubectl apply -f k8s/jwt-secret.yaml
# Or: kubectl create secret generic jwt-credentials \
#       --from-literal=Jwt__Key="$(openssl rand -base64 48)"
# Required: the backend won't start without it. Changing it signs everyone out.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-credentials
type: Opaque
stringData:
  Jwt__Key: ""
