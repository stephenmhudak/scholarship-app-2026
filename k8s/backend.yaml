apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: scholarship-app-2026-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: Storage__Provider
              value: "R2"
            - name: App__BaseUrl
              value: "https://scholarships.shudak.com"
          # Credentials come from Secrets created out-of-band (see k8s/*-secret.example.yaml)
          envFrom:
            - secretRef:
                name: jwt-credentials
            - secretRef:
                name: db-credentials
            - secretRef:
                name: r2-credentials
            - secretRef:
                name: email-credentials
                optional: true
            - secretRef:
                name: twofactor-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app: backend }
  ports:
    - port: 8080