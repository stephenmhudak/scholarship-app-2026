# Copy to twofactor-secret.yaml (gitignored), fill in the value, then: kubectl apply -f k8s/twofactor-secret.yaml
# Or: kubectl create secret generic twofactor-credentials \
#       --from-literal=TwoFactor__EncryptionKey="$(openssl rand -base64 32)"
# Required: the backend won't start without it. If the key is lost or changed,
# everyone enrolled in two-factor must have it reset by an admin.
apiVersion: v1
kind: Secret
metadata:
  name: twofactor-credentials
type: Opaque
stringData:
  TwoFactor__EncryptionKey: ""
