# Copy to mysql-secret.yaml (gitignored), fill in the password, then: kubectl apply -f k8s/mysql-secret.yaml
# MySQL only reads this when it first creates its volume. To change the password of an existing
# database, run ALTER USER in the pod, then update this Secret and db-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ""
  MYSQL_DATABASE: scholarship_db
