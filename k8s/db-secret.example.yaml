# Copy to db-secret.yaml (gitignored), fill in the password, then: kubectl apply -f k8s/db-secret.yaml
# Use the same password as MYSQL_ROOT_PASSWORD in mysql-secret.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  ConnectionStrings__Default: "Server=mysql;Database=scholarship_db;User=root;AllowPublicKeyRetrieval=True;Password="
