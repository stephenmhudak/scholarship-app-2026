# Copy to email-secret.yaml (gitignored), fill in values, then: kubectl apply -f k8s/email-secret.yaml
# Or: kubectl create secret generic email-credentials \
#       --from-literal=Email__Resend__ApiKey=re_... \
#       --from-literal=Email__From="Scholarship App <noreply@shudak.com>"
# Without this Secret the backend logs emails to the console instead of sending them.
apiVersion: v1
kind: Secret
metadata:
  name: email-credentials
type: Opaque
stringData:
  Email__Resend__ApiKey: ""
  Email__From: "Scholarship App <noreply@shudak.com>"
