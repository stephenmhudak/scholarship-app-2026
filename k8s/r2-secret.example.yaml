# Copy to r2-secret.yaml (gitignored), fill in values, then: kubectl apply -f k8s/r2-secret.yaml
# Or: kubectl create secret generic r2-credentials \
#       --from-literal=Storage__R2__AccountId=... \
#       --from-literal=Storage__R2__AccessKeyId=... \
#       --from-literal=Storage__R2__SecretAccessKey=... \
#       --from-literal=Storage__R2__BucketName=scholarship-files
apiVersion: v1
kind: Secret
metadata:
  name: r2-credentials
type: Opaque
stringData:
  Storage__R2__AccountId: ""
  Storage__R2__AccessKeyId: ""
  Storage__R2__SecretAccessKey: ""
  Storage__R2__BucketName: "scholarship-files"
